<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Button } = window.MellowbrowDesignSystem_20fe7e;
function Demo() {
  const [agree, setAgree] = React.useState(true);
  const [svc, setSvc] = React.useState("");
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18, alignItems: "start" }}>
      <Input label="성함" placeholder="홍길동" />
      <Input label="연락처" prefix="+82" placeholder="010-0000-0000" />
      <Select label="시술 선택" placeholder="메뉴를 골라주세요" options={["자연눈썹","콤보눈썹","섀도우눈썹","입술"]} value={svc} onChange={(e)=>setSvc(e.target.value)} />
      <Input label="이메일" error="올바른 형식이 아니에요" defaultValue="hello@" />
      <div style={{ gridColumn: "1 / -1", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <Checkbox checked={agree} onChange={setAgree} label="개인정보 수집·이용에 동의합니다" />
        <Button>예약 신청</Button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
