<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Soft & generous — never sharp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px 32px; background: var(--surface-page); display: flex; gap: 18px; align-items: flex-end; font-family: var(--font-sans); }
  .box { width: 74px; height: 74px; background: var(--surface-card); border: 1px solid var(--border-strong); }
  .cap { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; }
</style>
</head>
<body>
  <div><div class="box" style="border-radius:var(--radius-sm)"></div><div class="cap">sm · 8</div></div>
  <div><div class="box" style="border-radius:var(--radius-md)"></div><div class="cap">md · 14</div></div>
  <div><div class="box" style="border-radius:var(--radius-lg)"></div><div class="cap">lg · 22 (card)</div></div>
  <div><div class="box" style="border-radius:var(--radius-xl)"></div><div class="cap">xl · 32</div></div>
  <div><div class="box" style="border-radius:var(--radius-pill)"></div><div class="cap">pill</div></div>
</body>
</html>
