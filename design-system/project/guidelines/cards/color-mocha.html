<!-- @dsCard group="Colors" viewport="700x170" name="Mocha — brand scale" subtitle="The eyebrow-ink browns that carry the brand" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 26px 32px; background: var(--surface-page); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 78px; display: flex; align-items: flex-end; padding: 7px; }
  .sw span { font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.02em; }
  .lbls { display: flex; margin-top: 8px; }
  .lbls div { flex: 1; font-family: var(--font-sans); font-size: 10.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--mocha-100)"><span style="color:#6B5544">100</span></div>
    <div class="sw" style="background:var(--mocha-200)"><span style="color:#6B5544">200</span></div>
    <div class="sw" style="background:var(--mocha-300)"><span style="color:#4A3B30">300</span></div>
    <div class="sw" style="background:var(--mocha-400)"><span style="color:#4A3B30">400</span></div>
    <div class="sw" style="background:var(--mocha-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--mocha-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--mocha-700)"><span style="color:#fff">700·primary</span></div>
    <div class="sw" style="background:var(--mocha-800)"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--mocha-900)"><span style="color:#fff">900·ink</span></div>
  </div>
</body>
</html>
