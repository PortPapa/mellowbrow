<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 26px 32px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--border-soft); }
  .row:last-child { border: 0; }
  .lbl { width: 96px; color: var(--text-muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .s1 { font-size: 22px; font-weight: 600; }
  .s2 { font-size: 17px; font-weight: 500; }
  .s3 { font-size: 15px; font-weight: 400; color: var(--text-secondary); }
  .s4 { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row"><span class="lbl">Semibold 22</span><span class="s1">예약 안내 Booking</span></div>
  <div class="row"><span class="lbl">Medium 17</span><span class="s2">100% 예약제로 운영합니다</span></div>
  <div class="row"><span class="lbl">Regular 15</span><span class="s3">시술 전 충분한 상담을 통해 얼굴형에 맞는 디자인을 제안드려요.</span></div>
  <div class="row"><span class="lbl">Caption 13</span><span class="s4">평일 11:00–20:00 · 주말 예약 문의</span></div>
</body>
</html>
