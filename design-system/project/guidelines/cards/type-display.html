<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-page); }
  .big { font-family: var(--font-display); font-weight: 500; font-size: 64px; line-height: 1.05; letter-spacing: -0.01em; color: var(--text-primary); }
  .it { font-style: italic; color: var(--mocha-600); }
  .meta { margin-top: 14px; display: flex; gap: 18px; color: var(--text-muted); font-size: 12px; letter-spacing: 0.02em; }
  .meta b { color: var(--text-secondary); font-weight: 600; }
</style>
</head>
<body>
  <div class="big">Soft, mellow <span class="it">brows</span></div>
  <div class="meta"><span><b>Cormorant Garamond</b></span><span>Regular · Medium · Italic</span><span>Display headlines, wordmark</span></div>
</body>
</html>
