<!-- @dsCard group="Colors" viewport="700x160" name="Blush accent" subtitle="Soft beauty warmth — used sparingly for highlights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 26px 32px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .chip { height: 62px; border-radius: var(--radius-sm); }
  .cap { font-family: var(--font-sans); font-size: 11px; color: var(--text-secondary); margin-top: 6px; }
  .cap small { display:block; color: var(--text-muted); font-size: 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="chip" style="background:var(--blush-100)"></div><div class="cap">blush-100<small>#F6E7E1</small></div></div>
    <div><div class="chip" style="background:var(--blush-300)"></div><div class="cap">blush-300<small>#E8C9BE</small></div></div>
    <div><div class="chip" style="background:var(--blush-500)"></div><div class="cap">blush-500 · accent<small>#D29F8E</small></div></div>
    <div><div class="chip" style="background:var(--blush-700)"></div><div class="cap">blush-700<small>#B27866</small></div></div>
  </div>
</body>
</html>
