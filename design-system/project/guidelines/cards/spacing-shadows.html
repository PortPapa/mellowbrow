<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation / shadows" subtitle="Warm-tinted, very soft" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 30px 32px; background: var(--surface-page); display: flex; gap: 26px; font-family: var(--font-sans); }
  .card { width: 120px; height: 84px; background: var(--surface-card); border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card" style="box-shadow:var(--shadow-xs)">xs</div>
  <div class="card" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="card" style="box-shadow:var(--shadow-md)">md</div>
  <div class="card" style="box-shadow:var(--shadow-lg)">lg</div>
</body>
</html>
