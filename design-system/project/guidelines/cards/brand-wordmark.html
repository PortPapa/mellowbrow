<!-- @dsCard group="Brand" viewport="700x230" name="Wordmark" subtitle="Typographic logo — Cormorant Garamond. Lockups: full / short / stacked" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px 32px; background: var(--surface-page); display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  .word { font-family: var(--font-display); font-weight: 500; letter-spacing: 0.01em; color: var(--text-primary); line-height: 1; }
  .full { font-size: 38px; }
  .full em { font-style: italic; color: var(--mocha-600); }
  .stack { display:flex; flex-direction:column; align-items:center; gap: 4px; }
  .stack .mb { font-family: var(--font-display); font-size: 34px; font-weight:500; }
  .stack .tag { font-family: var(--font-sans); font-size: 9px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--text-muted); }
  .mono { width:56px; height:56px; border-radius:999px; background: var(--mocha-700); color: var(--paper); font-family: var(--font-display); font-size: 30px; font-style: italic; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="word full">mellow<em>brow</em></div>
  <div class="stack"><span class="mb">mellowbrow</span><span class="tag">Brow Atelier · Seoul</span></div>
  <div class="mono">m</div>
</body>
</html>
