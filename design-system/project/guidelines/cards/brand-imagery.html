<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px 32px; background: var(--surface-page); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ph { aspect-ratio: 4/3; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; font-size: 11px; letter-spacing: 0.04em; color: var(--mocha-700); text-align:center; padding: 8px; }
  .a { background: linear-gradient(135deg, #EEDFD0, #E2C7B5); }
  .b { background: linear-gradient(135deg, #F3E7E1, #E7CABB); }
  .c { background: linear-gradient(135deg, #EAE0D2, #D6C2A8); }
  .note { margin-top: 12px; font-size: 11.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="ph a">브로우 클로즈업<br>brow close-up</div>
    <div class="ph b">스튜디오 무드<br>studio mood</div>
    <div class="ph c">전후 비교<br>before / after</div>
  </div>
  <div class="note">Warm tone, gentle soft-focus, plenty of negative space. Replace placeholders with real photography from the studio.</div>
</body>
</html>
