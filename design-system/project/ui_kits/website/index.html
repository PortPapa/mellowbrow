<!-- @startingPoint section="Website" subtitle="Full Mellowbrow brow-studio site (home, services, gallery, booking)" viewport="1280x880" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mellowbrow · 멜로브로우</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--surface-page); }
  svg.lucide { width: 1em; height: 1em; display: block; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--mocha-200); border-radius: 999px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Gallery.jsx"></script>
<script type="text/babel" src="Booking.jsx"></script>
<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState("home");
  const navigate = (r) => { setRoute(r); window.scrollTo({ top: 0, behavior: "smooth" }); };

  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  const { Header, Footer, Home, Services, Gallery, Booking } = window;
  const screens = { home: Home, services: Services, gallery: Gallery, booking: Booking };
  const Screen = screens[route] || Home;

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <Header route={route} onNavigate={navigate} />
      <main style={{ flex: 1 }}>
        <Screen onNavigate={navigate} />
      </main>
      <Footer onNavigate={navigate} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
